name: Draft Month Plan

on:
  schedule:
    # 06:00 Lagos on the 1st = 05:00 UTC. Early enough that the proposal is
    # waiting when the month starts, and it changes nothing on its own -- every
    # row it writes is a draft until approved.
    - cron: '0 5 1 * *'
  workflow_dispatch:   # manual trigger button

permissions:
  contents: read   # git ls-files, to build the repository profile
  issues: write    # so a failed run can tell someone

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Draft the month
        run: node scripts/plan-month.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Required. The service key bypasses RLS and has no auth.uid(), so a
          # row written without this is one migration 015 hides from you in the
          # app, with no error anywhere. The script refuses to start without it.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          # The secrets are named OLLAMA_KEY / NVIDIA_KEY in this repository.
          # The `||` accepts either spelling, because a secret that does not
          # exist resolves to an empty string with no error -- which is how
          # these read as unset for weeks while a perfectly good key sat in
          # settings.
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_KEY || secrets.OLLAMA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_KEY || secrets.NVIDIA_API_KEY }}
          # Optional overrides. Set these as repository *variables* if a model
          # is renamed or retired, so it needs no code change.
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}

      # Same shape as the Gmail sync's failure step, and for the same reason: a
      # silent cron is a cron you find out about days late. One issue, reopened
      # and commented on, rather than a new one every month.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Month planning is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled month planner failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- A column error — `supabase/migrations/011_month_planner.sql` has not been run.',
              '- No LLM provider — check the run log for the `hasAnyProvider` line.',
              '  An unset secret resolves to an empty string with no error.',
              '- A missing secret — check the env block in the run log for a blank value.',
              '',
              'Nothing is lost while this is failing. The planner only ever writes',
              'drafts, so a month with no plan is a month you plan yourself.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
