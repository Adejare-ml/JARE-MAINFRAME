name: Weekly Backup

# Supabase's free tier keeps no backups. Once a week this writes the same
# JSON bundle Settings → Export produces -- every table, bank emails
# included -- to a private repository of the owner's, as
# backups/<date>.json and latest.json. See scripts/backup.mjs and the
# README's "Backups" section for the one-time setup: a private repository,
# a fine-grained token with Contents read and write on it, the BACKUP_REPO
# variable and the BACKUP_REPO_TOKEN secret. Until those exist the run
# fails and says so; a backup that is silently not configured is the
# failure this exists to prevent.
on:
  schedule:
    # Sunday 03:41 UTC. Nothing else runs then, and a late start (public
    # repositories get their scheduled runs hours late) still lands on
    # Sunday.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the bundle and print what would be written, without writing ("true"/"false")'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write    # so a failed run can tell someone

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Write the backup
        run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional while the project has one account; the script looks it
          # up. See scripts/lib/ownerId.mjs.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          # owner/name of the PRIVATE repository the files go to. A
          # repository variable, not a secret: it is a name, and the script
          # refuses this (public) repository whatever it is set to.
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          # A fine-grained personal access token with Contents: read and
          # write on that one repository and nothing else.
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          # A scheduled run has no input, so this is empty and the script
          # writes; a manual run passes what the button said.
          BACKUP_DRY_RUN: ${{ inputs.dry_run }}

      # Same shape as every other cron's failure step: one issue, reopened
      # and commented on, rather than a new one every week.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly backup is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The weekly backup failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- `BACKUP_REPO` (a repository variable) or `BACKUP_REPO_TOKEN` (a secret) is',
              '  not set — the README\'s "Backups" section has the four steps.',
              '- The token has expired, or does not have Contents: read and write on',
              '  that repository — GitHub answers 401 or 404 in the log.',
              '- `BACKUP_REPO` names this public repository; the script refuses that.',
              '- A missing Supabase secret — check the env block in the run log.',
              '',
              'Until this passes again there is no copy of the ledger newer than the',
              'last `backups/<date>.json` in the backup repository.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
