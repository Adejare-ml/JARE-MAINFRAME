name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check sync scripts parse
        run: |
          node --check scripts/gmail-sync.mjs
          node --check scripts/llm.mjs
          node --check scripts/test-llm.mjs
