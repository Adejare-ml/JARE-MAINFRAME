name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # checkout and the npm cache; nothing here writes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Real mistakes and accessibility only (eslint.config.js); warnings
      # print but do not fail the build.
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check scheduled scripts parse
        run: |
          node --check scripts/llm.mjs
          node --check scripts/test-llm.mjs
          node --check scripts/db-test.mjs
          node --check scripts/verify-repo.mjs
          node --check scripts/plan-month.mjs
          node --check scripts/snapshot-net-worth.mjs
          node --check scripts/weekly-recap.mjs
          node --check scripts/remind.mjs
          node --check scripts/backup.mjs
          node --check scripts/generate-vapid.mjs
          node --check scripts/lib/assertProgress.mjs
          node --check scripts/lib/ownerId.mjs
          node --check scripts/lib/recordRun.mjs
          node --check public/sw.js

      # `node --check` parses syntax without resolving imports, so it cannot see
      # a bad module path. That gap hid a missing `.js` in summary.js which made
      # planning.js -- and everything importing it -- unloadable outside Vite,
      # while every test still passed because Vitest resolves extensionless paths.
      #
      # These are the modules scripts/ imports, or is about to: they have to load
      # under plain Node, not just under the bundler.
      - name: Check shared modules load under Node
        run: |
          for m in planning queries summary schema constants formatters debts repo repoProfile planReview planPrompt speech calendar sparkline transactionGroups insight recurring pendingTransactions haptics theme privacy weekreview activity recapPrompt recapReview nlQuery nlQueryPrompt swipeGesture contrast health projects repairs export transfers categories categoryRules reminders anomalies refunds monthRecap push auth discovery meals mealPrompt imagePrep setup latest wallets backup normalize batchPrompt walletRouting diet/nutrition diet/recipes diet/totals diet/settings diet/verdict diet/target diet/foods diet/sheet; do
            node --input-type=module -e "await import('./src/lib/$m.js')" \
              || { echo "::error::src/lib/$m.js does not load under Node"; exit 1; }
          done
          node --input-type=module -e "await import('./scripts/lib/assertProgress.mjs')" \
            || { echo "::error::scripts/lib/assertProgress.mjs does not load under Node"; exit 1; }
          node --input-type=module -e "await import('./scripts/lib/ownerId.mjs')" \
            || { echo "::error::scripts/lib/ownerId.mjs does not load under Node"; exit 1; }
          node --input-type=module -e "await import('./scripts/lib/recordRun.mjs')" \
            || { echo "::error::scripts/lib/recordRun.mjs does not load under Node"; exit 1; }

  # The SQL layer, executed: every migration applied to a real Postgres in
  # the README's fresh-project order, then the functions the Routine and the
  # app call exercised (scripts/db-test.mjs). The runner image ships with
  # PostgreSQL installed and stopped; pg_cron is stubbed (tests/sql).
  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL with the pg_cron stub
        run: |
          sudo cp tests/sql/pg_cron-stub/pg_cron.control tests/sql/pg_cron-stub/pg_cron--1.6.sql "$(pg_config --sharedir)/extension/"
          sudo systemctl start postgresql
          sudo -u postgres psql -c "alter user postgres password 'postgres';"
          pg_isready -h localhost
      - name: Apply every migration and exercise the functions
        run: npm run test:db
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
