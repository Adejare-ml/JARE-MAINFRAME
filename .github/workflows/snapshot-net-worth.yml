name: Snapshot Net Worth

on:
  # The schedule is retired (28 Sep 2026): the snapshot runs inside the
  # database now, as a pg_cron job at 10:00 UTC exactly (migration 037,
  # snapshot_net_worth()). This was the one job GitHub's scheduling delay on
  # a public repository could break -- nine hours late on the 28th, and the
  # row is dated "yesterday" from the moment the script runs, so a delay
  # past midnight would skip a day. A manual run here still works and
  # writes the same row the same way.
  workflow_dispatch:   # manual trigger button

permissions:
  contents: read
  issues: write    # so a failed run can tell someone

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Snapshot net worth
        run: node scripts/snapshot-net-worth.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional while the project has one account: the script looks it up
          # (scripts/lib/ownerId.mjs) and the database pins it (035). Required
          # the moment auth.users holds more than one row.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}

      # Same shape as the other four scheduled scripts' failure step: one
      # issue, reopened and commented on, rather than a new one every night.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Net worth snapshot is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled net worth snapshot failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- A table error — `supabase/migrations/018_wallet_snapshots.sql` has not been run.',
              '- A missing secret — check the env block in the run log for a blank value.',
              '',
              'While this is failing, the net worth chart simply stops gaining new',
              'points rather than showing a wrong one -- a missing day reads as a gap,',
              'not a flat line, so it will not be mistaken for "nothing changed".',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
