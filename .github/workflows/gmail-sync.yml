name: Gmail Transaction Sync

on:
  # The schedule is retired. The Google refresh token this needs expires
  # every seven days while the OAuth app is in "Testing" status, and the
  # sync had been dead on invalid_grant since mid-August. Bank alerts are
  # now read by the owner's Claude scheduled task ("Daily spending audit"),
  # which writes through ingest_alert_transaction (migration 032). Manual
  # runs still work here with a fresh token, for a backfill.
  workflow_dispatch:   # manual trigger button

permissions:
  contents: read
  issues: write   # so a failed run can tell someone

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Run Gmail Sync Script
        run: node scripts/gmail-sync.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional while the project has one account: the script looks it up
          # (scripts/lib/ownerId.mjs) and the database pins it (035). Required
          # the moment auth.users holds more than one row.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          # The secrets are named OLLAMA_KEY / NVIDIA_KEY in this repository.
          # The `||` accepts either spelling, because a secret that does not
          # exist resolves to an empty string with no error -- which is how
          # these read as unset for weeks while a perfectly good key sat in
          # settings, and how categorization silently degraded to
          # Uncategorized/LOW on every run without anything saying so.
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_KEY || secrets.OLLAMA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_KEY || secrets.NVIDIA_API_KEY }}
          # Optional overrides. Set these as repository *variables* if a model
          # is renamed or retired, so it needs no code change.
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}

      # A silent cron is a cron you find out about days late. This sync failed
      # on two consecutive scheduled runs and nothing said so -- it surfaced
      # only because the app broke for an unrelated reason on the same morning.
      #
      # One issue, reopened and commented on, rather than a new one every four
      # hours: an inbox with six identical issues gets muted, which puts you
      # back where you started.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Gmail sync is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled Gmail sync failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- `invalid_grant` — the Google refresh token expired or was revoked.',
              '  Re-run `scripts/get-refresh-token.mjs` and update the',
              '  `GOOGLE_REFRESH_TOKEN` secret. If it recurs weekly, set the OAuth',
              '  consent screen to "In production" — refresh tokens issued by an app',
              '  in "Testing" status expire after 7 days.',
              '- A column error — a migration in `supabase/migrations/` has not been run.',
              '- A missing secret — check the env block in the run log for a blank value.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
