name: Gmail Transaction Sync

on:
  schedule:
    # UTC times -- Lagos is UTC+1
    # 8am, 10am, 2pm, 6pm Lagos = 07,09,13,17 UTC
    - cron: '0 7,9,13,17 * * *'
  workflow_dispatch:   # manual trigger button

permissions:
  contents: read
  issues: write   # so a failed run can tell someone

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run Gmail Sync Script
        run: node scripts/gmail-sync.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Optional overrides. Set these as repository *variables* if a model
          # is renamed or retired, so it needs no code change.
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}

      # A silent cron is a cron you find out about days late. This sync failed
      # on two consecutive scheduled runs and nothing said so -- it surfaced
      # only because the app broke for an unrelated reason on the same morning.
      #
      # One issue, reopened and commented on, rather than a new one every four
      # hours: an inbox with six identical issues gets muted, which puts you
      # back where you started.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Gmail sync is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled Gmail sync failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- `invalid_grant` — the Google refresh token expired or was revoked.',
              '  Re-run `scripts/get-refresh-token.mjs` and update the',
              '  `GOOGLE_REFRESH_TOKEN` secret. If it recurs weekly, set the OAuth',
              '  consent screen to "In production" — refresh tokens issued by an app',
              '  in "Testing" status expire after 7 days.',
              '- A column error — a migration in `supabase/migrations/` has not been run.',
              '- A missing secret — check the env block in the run log for a blank value.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
