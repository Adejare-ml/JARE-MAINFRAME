name: Keep Schedules Alive

# GitHub switches off every scheduled workflow in a public repository after
# 60 days without a commit, silently: no run, no failure step, no issue. The
# jobs here only read the repository and the Claude task writes only to
# Supabase, so once development stops nothing commits any more, and around
# day 60 the crons would all stop together. Re-enabling a workflow through
# the API resets that clock. This runs every two weeks and re-enables each
# scheduled workflow, itself included.
#
# Not needed on a private repository, where the rule does not apply; it is
# harmless there.
on:
  schedule:
    - cron: '23 4 1,15 * *'
  workflow_dispatch:   # manual trigger button

permissions:
  actions: write   # enable-workflow is an Actions write; nothing else is touched

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const files = [
              'verify-repo.yml',
              'plan-month.yml',
              'snapshot-net-worth.yml',
              'weekly-recap.yml',
              'remind.yml',
              'keepalive.yml',
            ]
            const failed = []
            for (const file of files) {
              try {
                await github.rest.actions.enableWorkflow({ owner, repo, workflow_id: file })
                core.info(`enabled ${file}`)
              } catch (err) {
                failed.push(`${file}: HTTP ${err.status ?? '?'} ${err.message}`)
              }
            }
            if (failed.length) core.setFailed(`could not re-enable:\n  ${failed.join('\n  ')}`)
