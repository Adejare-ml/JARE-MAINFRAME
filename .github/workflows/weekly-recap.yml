name: Weekly Recap

on:
  schedule:
    # 10:17 Lagos on Monday = 09:17 UTC. The week (Monday-anchored, matching
    # startOfWeek everywhere else in this app) has closed, and the Claude
    # audit has already recorded Sunday's alerts at 08:08 UTC. At 05:00 the
    # recap compared a week missing its last day with a complete one. The
    # odd minute keeps it off the top-of-the-hour crowd GitHub sometimes
    # delays or drops.
    - cron: '17 9 * * 1'
  workflow_dispatch:   # manual trigger button

permissions:
  contents: read
  issues: write    # so a failed run can tell someone

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Recap the week
        run: node scripts/weekly-recap.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional while the project has one account: the script looks it up
          # (scripts/lib/ownerId.mjs) and the database pins it (035). Required
          # the moment auth.users holds more than one row.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          # The secrets are named OLLAMA_KEY / NVIDIA_KEY in this repository.
          # The `||` accepts either spelling, because a secret that does not
          # exist resolves to an empty string with no error.
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_KEY || secrets.OLLAMA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_KEY || secrets.NVIDIA_API_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}

      # Same shape as the other scheduled scripts' failure step: one issue,
      # reopened and commented on, rather than a new one every week.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly recap is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled weekly recap failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- A table error — `supabase/migrations/023_week_recaps.sql` has not been run.',
              '- No LLM provider — check the run log for the `hasAnyProvider` line.',
              '  An unset secret resolves to an empty string with no error.',
              '- A missing secret — check the env block in the run log for a blank value.',
              '',
              'Nothing is lost while this is failing. A missed week simply shows no',
              'recap card rather than a wrong one, since nothing is written until',
              'the model\'s sentences have passed src/lib/recapReview.js.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
