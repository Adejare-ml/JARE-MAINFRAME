name: Delete Branches

# Manual only. The git credential that pushes this repo's PRs cannot delete
# a ref (HTTP 403, every branch, every time), and no API tool in that
# session can either. Inside Actions, GITHUB_TOKEN gets exactly what the
# permissions block below grants -- so this is where branch cleanup lives.
# It is also the repeatable answer to the Palette app, which recreates a
# branch and a PR every day or two whatever gets closed.
on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branch names to delete -- one per line, or comma-separated'
        required: true
      dry_run:
        description: 'Report what would be deleted without deleting ("true"/"false")'
        required: false
        default: 'false'

permissions:
  contents: write       # deleting a ref is a Git-database write
  pull-requests: read   # the open-PR guard; free on a public repo, required the day this one isn't

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      # github-script rather than `git push --delete`: nothing to check out,
      # and the names go in through env, so none of them ever reach a shell
      # or get spliced into this script's source.
      - uses: actions/github-script@v7
        env:
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo
            const dryRun = process.env.DRY_RUN === 'true'

            const { data: repository } = await github.rest.repos.get({ owner, repo })
            const defaultBranch = repository.default_branch

            const names = [...new Set(
              process.env.BRANCHES
                .split(/[\n,]/)
                .map((s) => s.trim().replace(/^refs\/heads\//, ''))
                .filter(Boolean),
            )]

            const deleted = [], skipped = [], failed = []

            for (const name of names) {
              if (name === defaultBranch) {
                skipped.push(`${name}: the default branch is never deleted here`)
                continue
              }

              const { data: openPrs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${name}`, per_page: 1,
              })
              if (openPrs.length > 0) {
                skipped.push(`${name}: open PR #${openPrs[0].number} -- close it first`)
                continue
              }

              if (dryRun) {
                deleted.push(name)
                continue
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` })
                deleted.push(name)
              } catch (err) {
                // "Reference does not exist" is the outcome we wanted, already
                // true: GitHub removes a branch itself when its PR closes with
                // auto-delete on, and Palette prunes its own sometimes. Matched
                // on the message, not just the status -- a branch protection or
                // ruleset refusing the delete is also a 422, and that one must
                // read as a failure, not as done.
                if (err.status === 404 || (err.status === 422 && /does not exist/i.test(err.message))) {
                  skipped.push(`${name}: already gone`)
                } else {
                  failed.push(`${name}: HTTP ${err.status ?? '?'} ${err.message}`)
                }
              }
            }

            const show = (label, items) => {
              if (items.length) core.info(`${label} (${items.length}):\n  ${items.join('\n  ')}`)
            }
            show(dryRun ? 'Would delete' : 'Deleted', deleted)
            show('Skipped', skipped)
            show('Failed', failed)
            if (failed.length) core.setFailed(`${failed.length} branch(es) could not be deleted`)
