name: Morning Reminder

on:
  schedule:
    # 07:30 Lagos = 06:30 UTC. After the overnight Gmail syncs have run, so
    # the review count and last night's bills are in; before the day starts.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the digest without sending ("true"/"false")'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write    # so a failed run can tell someone

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Build the digest
        run: node scripts/remind.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional while the project has one account; the script looks it
          # up. See scripts/lib/ownerId.mjs.
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          # A scheduled run has no input, so this is empty and the script
          # decides; a manual run passes what the button said.
          REMIND_DRY_RUN: ${{ inputs.dry_run }}
          REMIND_LOOKBACK_DAYS: ${{ vars.REMIND_LOOKBACK_DAYS }}

      # Same shape as every other cron's failure step: one issue, reopened
      # and commented on, rather than a new one every morning.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Morning reminder is failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The scheduled reminder digest failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, most likely first:',
              '- A missing secret — check the env block in the run log for a blank value.',
              '- `OWNER_USER_ID` could not be resolved — more than one account in auth.users.',
              '- A table error on debts or transactions — a migration has not been run.',
              '',
              'Repairs, projects and milestones are optional: a database without them',
              'costs the digest those lines, not the run.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sync-failure',
              per_page: 10,
            })

            const open = existing.data.find(i => i.title === title)
            if (open) {
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'open',
                })
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-failure'],
              })
            }
